<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNISTAY - Add Property</title>

<style>
:root {
    --bg: #050b15;
    --panel: rgba(12, 25, 43, .78);
    --line: rgba(179, 222, 255, .15);
    --text: #f2f8ff;
    --muted: #97aac0;
    --blue: #7ecbff;
    --blue-strong: #4da6ff;
    --red: #ff8490;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, "Segoe UI", Arial, sans-serif; }

html, body { min-height: 100%; }

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 30px 0;
    color: var(--text);
    background:
        radial-gradient(circle at 12% 3%, rgba(77,166,255,.2), transparent 28rem),
        radial-gradient(circle at 88% 88%, rgba(168,85,247,.14), transparent 27rem),
        linear-gradient(145deg, #040812, var(--bg) 52%, #0b172a);
}

body::before,
body::after {
    content: "";
    position: fixed;
    z-index: 0;
    width: 22rem;
    height: 22rem;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .15;
    pointer-events: none;
}

body::before { top: 20%; left: -13rem; background: #4da6ff; }
body::after { right: -13rem; bottom: 3%; background: #9d6eff; }

button, input, select, textarea { font: inherit; }

/* PARTICLES */
.particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.particle { position: absolute; color: rgba(126,203,255,.14); animation: floatUp linear infinite; text-shadow: 0 0 12px rgba(77,166,255,.7); user-select: none; }
@keyframes floatUp { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 20% { opacity: .4; } 100% { transform: translateY(-10vh) rotate(180deg); opacity: 0; } }

/* CONTAINER */
.container {
    position: relative;
    z-index: 2;
    width: min(540px, calc(100% - 32px));
    max-height: calc(100vh - 46px);
    overflow-y: auto;
    padding: clamp(24px, 5vw, 34px);
    border: 1px solid rgba(179,222,255,.19);
    border-radius: 25px;
    background: linear-gradient(145deg, rgba(20, 40, 66, .8), rgba(7, 16, 29, .8));
    box-shadow: 0 28px 75px rgba(0,0,0,.38), 0 0 55px rgba(77,166,255,.08), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(25px) saturate(130%);
    -webkit-backdrop-filter: blur(25px) saturate(130%);
    scrollbar-width: thin;
    scrollbar-color: rgba(126,203,255,.35) transparent;
}

.container::-webkit-scrollbar { width: 5px; }
.container::-webkit-scrollbar-thumb { border-radius: 99px; background: rgba(126,203,255,.35); }

.container::before {
    content: "";
    position: absolute;
    width: 16rem;
    height: 16rem;
    top: -11rem;
    right: -5rem;
    border-radius: 50%;
    background: rgba(77,166,255,.15);
    filter: blur(22px);
    pointer-events: none;
}

h2 {
    position: relative;
    margin-bottom: 25px;
    color: #f5fbff;
    font-size: 28px;
    letter-spacing: -.6px;
    text-align: left;
}

h2::after {
    content: "";
    display: block;
    width: 45px;
    height: 3px;
    margin-top: 11px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--blue-strong), var(--blue));
}

.input-group { margin-top: 14px; }

input, select, textarea {
    display: block;
    width: 100%;
    min-height: 47px;
    padding: 12px 14px;
    outline: none;
    color: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(2, 9, 18, .55);
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

input::placeholder, textarea::placeholder { color: #8498b0; }
select { color: #dceafa; cursor: pointer; }
select option { color: white; background: #0b1728; }
input:focus, select:focus, textarea:focus { border-color: rgba(126,203,255,.72); background: rgba(8,22,39,.8); box-shadow: 0 0 0 4px rgba(77,166,255,.11), 0 0 20px rgba(77,166,255,.08); }
textarea { min-height: 102px; margin-top: 14px; resize: vertical; }

#amenities { margin-top: 14px; }

.error { display: none; margin: 5px 3px 0; color: var(--red); font-size: 12px; font-weight: 700; }

/* FILE INPUT */
input[type="file"] { padding: 9px 10px; color: var(--muted); cursor: pointer; }
input[type="file"]::file-selector-button { margin-right: 10px; padding: 7px 11px; color: #06111e; border: none; border-radius: 8px; background: linear-gradient(135deg, #c0edff, var(--blue-strong)); cursor: pointer; font-weight: 800; }

/* BUTTON */
button {
    width: 100%;
    min-height: 49px;
    margin-top: 21px;
    padding: 13px;
    color: #06111e;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 13px;
    background: linear-gradient(135deg, #c0edff, var(--blue-strong));
    box-shadow: 0 12px 25px rgba(77,166,255,.2);
    cursor: pointer;
    font-weight: 800;
    transition: transform .24s ease, filter .24s ease, box-shadow .24s ease;
}

button:hover { transform: translateY(-3px); filter: brightness(1.06); box-shadow: 0 16px 30px rgba(77,166,255,.32); }
button:active { transform: translateY(-1px); }

@media (max-width: 560px) {
    body { align-items: flex-start; padding: 18px 0; }
    .container { width: calc(100% - 24px); max-height: calc(100vh - 36px); padding: 22px 18px; border-radius: 21px; }
    h2 { font-size: 24px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<div class="container">

    <h2>Add Property</h2>

    <div class="input-group">
        <input id="hostelName" placeholder="Hostel Name">
        <div class="error" id="err-hostelName">Field needed</div>
    </div>

    <div class="input-group">
        <select id="university">
            <option value="">Select University</option>
            <option>Makerere University</option>
            <option>Kyambogo University</option>
            <option>Makerere University Business School</option>
            <option>Uganda Christian University</option>
            <option>Victoria University</option>
            <option>Gulu University</option>
            <option>Mbarara University of Science and Technology</option>
            <option>Kabale University</option>
            <option>Kampala International University</option>
            <option>Cavendish University Uganda</option>
        </select>
        <div class="error" id="err-university">Field needed</div>
    </div>

    <div class="input-group">
        <select id="location">
            <option value="">Select Location</option>
        </select>
        <div class="error" id="err-location">Field needed</div>
    </div>

    <div class="input-group">
        <input id="price" type="number" placeholder="Price (UGX)">
        <div class="error" id="err-price">Field needed</div>
    </div>

    <div class="input-group">
        <input id="contact" placeholder="Contact">
        <div class="error" id="err-contact">Field needed</div>
    </div>

    <input id="amenities" placeholder="Amenities (WiFi, Water, Security)">
    <textarea id="description" placeholder="Description"></textarea>

    <div class="input-group">
        <input type="file" id="image">
        <div class="error" id="err-image">Field needed</div>
    </div>

    <button onclick="submitProperty()">Submit Property</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, addDoc } 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwDxwL4j_fgzGi1ffHhaG36nw2uzNiZ1E",
  authDomain: "unistay-v1.firebaseapp.com",
  projectId: "unistay-v1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;

onAuthStateChanged(auth, (user) => {
    if (!user) {
        alert("Please log in first");
        window.location = "auth.html";
        return;
    }

    currentUser = user;
    console.log("✅ Logged in as:", user.uid);
});


/* CLOUDINARY */
const upload = async (file) => {
    const url = "https://api.cloudinary.com/v1_1/dsanvos33/image/upload";
    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", "unistay-images");

    const res = await fetch(url, { method: "POST", body: form });
    const data = await res.json();

    return data.secure_url;
};

/* LOCATION DATA */
const data = {
    "Makerere University": ["Wandegeya","Kikoni","Bwaise","Makerere Hill","Naakulabye"],
    "Kyambogo University": ["Banda","Kiwatule","Ntinda","Naalya","Kyambogo Hill"],
    "Makerere University Business School": ["Nakawa","Bugolobi","Mbuya","Luzira","Kitintale"],
    "Uganda Christian University": ["Mukono","Seeta","Namilyango","Goma","Sonde"],
    "Victoria University": ["Nakasero","Kololo","Kampala Road","Nsambya","CBD"],
    "Gulu University": ["Pece","Bardege","Layibi","Gulu Town","Laroo"],
    "Mbarara University of Science and Technology": ["Kakoba","Nyamitanga","Kamukuzi","Mbarara Town","Katete"],
    "Kabale University": ["Makanga","Kabale Town","Kikungiri","Rushoroza","Nyabikoni"],
    "Kampala International University": ["Kansanga","Ggaba Road","Muyenga","Makindye","Kabalagala"],
    "Cavendish University Uganda": ["Nsambya","Nakasero","Kampala CBD","Wandegeya","Nateete"]
};

/* DROPDOWN */
document.getElementById("university").addEventListener("change", function () {

    const uni = this.value;
    const locationSelect = document.getElementById("location");

    locationSelect.innerHTML = `<option value="">Select Location</option>`;

    if (data[uni]) {
        data[uni].forEach(loc => {
            let opt = document.createElement("option");
            opt.value = loc;
            opt.textContent = loc;
            locationSelect.appendChild(opt);
        });
    }
});

/* VALIDATION + SUBMIT (UNCHANGED) */
function showError(id, show) {
    document.getElementById("err-" + id).style.display = show ? "block" : "none";
}

function validate() {
    let valid = true;

    ["hostelName","university","location","price","contact"].forEach(f => {
        const val = document.getElementById(f).value;
        const empty = !val || val.trim() === "";
        showError(f, empty);
        if (empty) valid = false;
    });

    const file = document.getElementById("image").files[0];

    if (!file) {
        showError("image", true);
        valid = false;
    } else {
        showError("image", false);
    }

    return valid;
}

/* =========================
   SUBMIT PROPERTY
========================= */
window.submitProperty = async () => {

    if (!validate()) return;

    if (!currentUser) {
        alert("User not loaded yet. Try again.");
        return;
    }

    try {
        const hostelName = document.getElementById("hostelName").value;
        const university = document.getElementById("university").value;
        const location = document.getElementById("location").value;
        const price = document.getElementById("price").value;
        const contact = document.getElementById("contact").value;
        const amenities = document.getElementById("amenities").value;
        const description = document.getElementById("description").value;
        const file = document.getElementById("image").files[0];

        // Upload image
        const imageUrl = await upload(file);

        // Save to Firestore
        await addDoc(collection(db, "properties"), {
            hostelName,
            university,
            location,
            price,
            contact,
            amenities,
            description,
            cover: imageUrl,
            landlordId: currentUser.uid, // ✅ CRITICAL FIX
            status: "pending",
            createdAt: Date.now()
        });

        alert("Submitted successfully ✅");
        location.reload();

    } catch (err) {
        console.error("❌ ERROR:", err);
        alert("Failed to submit property");
    }
};

/* PARTICLES */
const symbols = ["∑","√","π","∞","∆","∫","±"];
const box = document.getElementById("particles");

for (let i = 0; i < 40; i++) {
    let p = document.createElement("div");
    p.className = "particle";
    p.innerText = symbols[Math.floor(Math.random()*symbols.length)];

    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (6 + Math.random()*6) + "s";
    p.style.fontSize = (32 + Math.random()*18) + "px";

    box.appendChild(p);
}

</script>

</body>
</html>
