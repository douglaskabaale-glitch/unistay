<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNISTAY Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="unistay-theme.css">

<style>
body{ display: flex; min-height: 100vh; }

/* ================= SIDEBAR ================= */
.sidebar{
    width: 240px;
    background: var(--paper-raised);
    color: var(--ink);
    padding: 20px;
    position: fixed;
    height: 100vh;
    border-right: 1px solid var(--rule);
}

.sidebar h2{
    margin-bottom: 26px;
    font-size: 18px;
}

.nav-item{
    padding: 11px 12px;
    margin: 4px 0;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 14px;
}
.nav-item:hover{ background: var(--paper); color: var(--ink); }

/* ================= MAIN ================= */
.main{
    margin-left: 240px;
    width: 100%;
    padding: 24px;
}

.header{
    background: var(--paper-raised);
    padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--rule);
    margin-bottom: 20px;
    font-weight: 700;
    font-family: "Lora", serif;
    color: var(--ink);
}

.grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 14px;
}

.card{
    background: var(--paper-raised);
    border-radius: var(--radius-md);
    padding: 16px;
    border: 1px solid var(--rule);
}
.card h3{ font-size: 15px; margin-bottom: 8px; }
.card p{ font-size: 13px; margin: 2px 0; }

/* STATUS */
.status{
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    display: inline-block;
    margin-top: 6px;
    font-weight: 700;
}
.pending{ background: var(--amber-tint); color: var(--amber); }
.approved{ background: var(--leaf-green-tint); color: var(--leaf-green); }
.verified{ background: var(--pen-blue-tint); color: var(--pen-blue); }

/* BUTTONS */
.btn{
    margin-top: 8px;
    width: 100%;
    padding: 9px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    border: 1px solid var(--rule-strong);
    background: transparent;
    color: var(--ink);
}
.approve{ color: var(--leaf-green); }
.approve:hover{ background: var(--leaf-green-tint); border-color: var(--leaf-green); }
.delete{ color: var(--pen-red); }
.delete:hover{ background: var(--pen-red-tint); border-color: var(--pen-red); }
.verify{ color: var(--gold); }
.verify:hover{ background: var(--gold-tint); border-color: var(--gold); }
.unverify{ color: var(--ink-soft); }
.unverify:hover{ background: var(--paper); }

/* VERIFIED BADGE */
.badge{ display: inline-flex; align-items: center; margin-left: 6px; }
.badge-circle{
    width: 16px;
    height: 16px;
    background: var(--gold);
    border-radius: 50%;
    position: relative;
}
.check{
    position: absolute;
    top: 0;
    left: 3px;
    font-size: 10px;
    color: #fff;
    font-weight: 900;
}

.receipts-panel{ padding: 4px; color: var(--ink); }
.receipts-panel h3{ margin-bottom: 12px; }

.receipt-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 15px;
}

/* BASE BUTTON */
.receipt-btn{
    padding: 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--rule);
    cursor: pointer;
    font-weight: 700;
    color: #fff;
}

/* THEMES — flat solid fills, no glow */
.boost{ background: var(--pen-blue); }
.amplify{ background: var(--leaf-green); }
.prime{ background: #6A4C93; }
.elite{ background: var(--gold); color: var(--ink); }

/* MODAL */
.modal{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(34,28,20,0.45);
    justify-content: center;
    align-items: center;
    padding: 16px;
    z-index: 100;
}

.modal-card{
    background: var(--paper-raised);
    padding: 22px;
    border-radius: var(--radius-md);
    width: 100%;
    max-width: 320px;
    border: 1px solid var(--rule);
}
.modal-card h3{ margin-bottom: 12px; font-size: 16px; }

.modal-card input{
    width: 100%;
    margin: 6px 0;
    padding: 10px;
    border-radius: var(--radius-sm);
    background: var(--paper);
    border: 1px solid var(--rule-strong);
    color: var(--ink);
}

.generate-btn{
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    background: var(--pen-blue);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-weight: 700;
}
.generate-btn:hover{ background: var(--pen-blue-dark); }

.close-btn{
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--rule-strong);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
}
.close-btn:hover{ background: var(--paper); }
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h2>UNISTAY Admin</h2>

    <div class="nav-item" onclick="showSection('users')">Users</div>
    <div class="nav-item" onclick="showSection('properties')">Properties</div>
    <div class="nav-item" onclick="showSection('receipts')">Receipts</div>

    <div class="nav-item" onclick="logout()">Log out</div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

    <div class="header" id="title">Dashboard</div>

    <!-- USERS -->
    <div id="usersSection">
        <h3>Users management</h3>
        <div class="grid" id="users"></div>
    </div>

    <!-- PROPERTIES -->
    <div id="propertiesSection" style="display:none;">
        <h3>Property management</h3>
        <div class="grid" id="properties"></div>
    </div>

    <!-- RECEIPTS (NOW INSIDE MAIN) -->
    <div id="receiptsSection" style="display:none;" class="receipts-panel">

        <h3>Generate receipts</h3>

        <div class="receipt-grid">

            <button class="receipt-btn boost" onclick="openReceipt('Boost')">
                Boost Receipt
            </button>

            <button class="receipt-btn amplify" onclick="openReceipt('Amplify')">
                Amplify Receipt
            </button>

            <button class="receipt-btn prime" onclick="openReceipt('Prime')">
                Prime Receipt
            </button>

            <button class="receipt-btn elite" onclick="openReceipt('Elite')">
                Elite Receipt
            </button>

        </div>
    </div>

</div>

<div id="receiptModal" class="modal">
    <div class="modal-card">

        <h3 id="receiptTitle">Generate Receipt</h3>

        <input id="rHostel" placeholder="Hostel Name">
        <input id="rDate" type="date">
        <input id="rAmount" placeholder="Funds Paid (UGX)">

        <button class="generate-btn" onclick="generateReceipt()">
            Generate PDF
        </button>

        <button onclick="closeReceipt()" class="close-btn">
            Cancel
        </button>

    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwDxwL4j_fgzGi1ffHhaG36nw2uzNiZ1E",
  authDomain: "unistay-v1.firebaseapp.com",
  projectId: "unistay-v1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "douglaskabaale@gmail.com";

/* AUTH (UNCHANGED LOGIC) */
onAuthStateChanged(auth, (user) => {
    if (!user || user.email !== ADMIN_EMAIL) {
        window.location = "auth.html";
    } else {
        loadUsers();
        loadProperties();
    }
});

/* NAV */
window.showSection = (section) => {

    const sections = ["usersSection", "propertiesSection", "receiptsSection"];

    sections.forEach(id => {
        document.getElementById(id).style.display = "none";
    });

    document.getElementById(section + "Section").style.display = "block";
};

/* USERS */
async function loadUsers() {
    const snap = await getDocs(collection(db, "users"));

    const box = document.getElementById("users");
    box.innerHTML = "";

    snap.forEach(u => {
        const d = u.data();

        const verified = d.status === "verified";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <h3>
                ${d.email || "No email"}

                ${verified ? `
                <span class="badge">
                    <span class="badge-circle"><span class="check">✔</span></span>
                </span>` : ""}
            </h3>

           <span class="status ${d.status || "pending"}">
              ${(d.status || "pending").toUpperCase()}
           </span>

           <button class="btn approve" onclick="approveUser('${u.id}')">
              Approve
           </button>

           <button class="btn verify" onclick="verify('${u.id}')">
              Verify
           </button>

           <button class="btn unverify" onclick="unverify('${u.id}')">
              Unverify
           </button>
        `;

        box.appendChild(card);
    });
}

/* PROPERTIES */
async function loadProperties() {

    const snap = await getDocs(collection(db, "properties"));

    const box = document.getElementById("properties");
    box.innerHTML = "";

    snap.forEach(p => {

        const d = p.data();

        const plan = d.plan || "boost";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <h3>${d.hostelName || "Unnamed Hostel"}</h3>

            <p>${d.university || "No University"}</p>

            <p>Plan: ${plan}</p>

            <span class="status ${d.status || "pending"}">
                ${(d.status || "pending").toUpperCase()}
            </span>

            <button class="btn approve" onclick="approve('${p.id}')">
                Approve
            </button>

            <button class="btn delete" onclick="remove('${p.id}')">
                Delete
            </button>
        `;

        box.appendChild(card);

    });
}

/* ACTIONS (UNCHANGED) */
window.verify = async (id) => {
    await updateDoc(doc(db,"users",id), { status:"verified" });
    loadUsers();
};

window.unverify = async (id) => {
    await updateDoc(doc(db,"users",id), { status:"approved" });
    loadUsers();
};

window.approve = async (id) => {
    await updateDoc(doc(db,"properties",id), { status:"approved" });
    loadProperties();
};

window.remove = async (id) => {
    await deleteDoc(doc(db,"properties",id));
    loadProperties();
};

window.logout = () => signOut(auth).then(() => window.location="auth.html");

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let selectedPlan = "";


function openReceipt(plan) {
    selectedPlan = plan;
    document.getElementById("receiptTitle").innerText =
        plan + " Subscription Receipt";

    document.getElementById("receiptModal").style.display = "flex";
}

function closeReceipt() {
    document.getElementById("receiptModal").style.display = "none";
}

/* =========================
   PDF GENERATION
========================= */
function generateReceipt() {

    const hostel = document.getElementById("rHostel").value;
    const date = document.getElementById("rDate").value;
    const amount = document.getElementById("rAmount").value;

    if (!hostel || !date || !amount) {
        alert("Fill all fields");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // ===================== COLORS (UNISTAY THEME) =====================
    const blue = [44, 91, 140];
    const dark = [30, 42, 56];
    const green = [61, 107, 74];
    const purple = [106, 76, 147];

    // ===================== HEADER =====================
    doc.setFillColor(...dark);
    doc.rect(0, 0, 210, 40, "F");

    doc.setTextColor(...blue);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(20);
    doc.text("UNISTAY", 14, 20);

    doc.setFontSize(11);
    doc.setTextColor(220, 225, 232);
    doc.text("Premium Hostel Listing Platform", 14, 28);

    doc.setTextColor(255, 255, 255);
    doc.text("OFFICIAL PAYMENT RECEIPT", 140, 20);

    // ===================== RECEIPT ID =====================
    const receiptId = "UNI-" + Math.floor(Math.random() * 99999999);

    doc.setFontSize(10);
    doc.setTextColor(150);
    doc.text("Receipt ID: " + receiptId, 140, 28);

    // ===================== BODY =====================
    doc.setTextColor(30, 30, 30);
    doc.setFontSize(12);

    doc.text("This document serves as an official confirmation of payment received by UNISTAY.", 14, 55);

    doc.setFont("helvetica", "bold");
    doc.text("Hostel Name:", 14, 75);
    doc.text(hostel, 60, 75);

    doc.text("Subscription Plan:", 14, 85);
    doc.text(selectedPlan, 60, 85);

    doc.text("Date of Payment:", 14, 95);
    doc.text(date, 60, 95);

    doc.text("Amount Paid:", 14, 105);
    doc.setTextColor(...green);
    doc.text("UGX " + amount, 60, 105);

    // ===================== PREMIUM MESSAGE =====================
    doc.setTextColor(60, 60, 60);
    doc.setFont("helvetica", "normal");

    doc.text(
        "UNISTAY confirms that the above payment has been successfully received and processed.",
        14,
        125,
        { maxWidth: 180 }
    );

    doc.text(
        "The hostel listing has been upgraded to the selected subscription tier and is now active on the platform.",
        14,
        140,
        { maxWidth: 180 }
    );

    // ===================== FOOTER =====================
    doc.setDrawColor(...blue);
    doc.line(14, 260, 196, 260);

    doc.setFontSize(10);
    doc.setTextColor(120);

    doc.text("Thank you for partnering with UNISTAY.", 14, 270);
    doc.text("This is a system-generated receipt and does not require a signature.", 14, 278);

    doc.save(hostel + "_UNISTAY_Receipt.pdf");

    closeReceipt();
}

</script>

</body>
</html>
