<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNISTAY Admin</title>

<style>
:root {
    --bg: #050b15;
    --panel: rgba(12, 25, 43, 0.72);
    --panel-strong: rgba(17, 34, 57, 0.9);
    --line: rgba(179, 222, 255, 0.14);
    --text: #f2f7ff;
    --muted: #98abc2;
    --blue: #7ecbff;
    --blue-strong: #4da6ff;
    --green: #5df39a;
    --gold: #ffd36a;
    --red: #ff7d8b;
    --shadow: 0 22px 60px rgba(0,0,0,.28);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, "Segoe UI", Arial, sans-serif; }

html { min-height: 100%; }

body {
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
    color: var(--text);
    background:
        radial-gradient(circle at 9% 0%, rgba(77,166,255,.2), transparent 28rem),
        radial-gradient(circle at 90% 34%, rgba(168,85,247,.14), transparent 28rem),
        linear-gradient(140deg, #040812, var(--bg) 50%, #0b172a);
}

body::before,
body::after {
    content: "";
    position: fixed;
    z-index: -1;
    width: 24rem;
    height: 24rem;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .15;
    pointer-events: none;
}

body::before { background: #4da6ff; left: -15rem; top: 45%; }
body::after { background: #a855f7; right: -14rem; bottom: 4%; }

button, input { font: inherit; }
button { cursor: pointer; }

/* ================= SIDEBAR ================= */
.sidebar {
    position: fixed;
    z-index: 10;
    width: 260px;
    height: calc(100vh - 32px);
    margin: 16px;
    padding: 22px 14px;
    color: white;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: linear-gradient(170deg, rgba(19, 47, 79, .82), rgba(6, 17, 31, .82));
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
}

.sidebar h2 {
    margin: 3px 10px 34px;
    color: #b9e6ff;
    font-size: 20px;
    letter-spacing: 1.8px;
    text-shadow: 0 0 18px rgba(126,203,255,.45);
}

.sidebar h2::after {
    content: "";
    display: block;
    width: 50px;
    height: 3px;
    margin-top: 10px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--blue-strong), var(--violet, #ad8cff));
}

.nav-item {
    display: flex;
    align-items: center;
    min-height: 46px;
    margin: 8px 0;
    padding: 12px 13px;
    border: 1px solid transparent;
    border-radius: 13px;
    color: #ccdbed;
    cursor: pointer;
    transition: .25s ease;
}

.nav-item:hover {
    color: white;
    border-color: rgba(126,203,255,.2);
    background: linear-gradient(90deg, rgba(126,203,255,.16), rgba(126,203,255,.04));
    transform: translateX(4px);
}

.nav-item:last-child {
    margin-top: 28px;
    color: #ffb9c0;
    border-top: 1px solid var(--line);
    border-radius: 0 0 13px 13px;
}

/* ================= MAIN ================= */
.main {
    width: 100%;
    min-width: 0;
    margin-left: 292px;
    padding: 26px clamp(18px, 3.5vw, 56px) 50px 0;
}

.header {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 72px;
    margin-bottom: 26px;
    padding: 18px 24px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 19px;
    color: #e9f6ff;
    background: linear-gradient(110deg, rgba(18, 44, 73, .8), rgba(8, 19, 34, .62));
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    font-size: 22px;
    letter-spacing: -.4px;
}

.header::after {
    content: "";
    position: absolute;
    width: 13rem;
    height: 13rem;
    top: -8rem;
    right: 8%;
    border-radius: 50%;
    background: rgba(77,166,255,.16);
    filter: blur(25px);
}

#usersSection, #propertiesSection, .receipts-panel { max-width: 1240px; }

h3 { color: #e5f2ff; font-size: 19px; letter-spacing: -.2px; }
#usersSection > h3, #propertiesSection > h3 { margin: 0 0 16px 2px; }

/* GRID & CARDS */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 17px;
}

.card {
    position: relative;
    overflow: hidden;
    min-height: 190px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 19px;
    background: linear-gradient(145deg, rgba(19, 38, 63, .78), rgba(8, 18, 32, .73));
    box-shadow: 0 15px 35px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.05);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    backdrop-filter: blur(18px);
}

.card::before {
    content: "";
    position: absolute;
    width: 9rem;
    height: 9rem;
    top: -6rem;
    right: -3rem;
    border-radius: 50%;
    background: rgba(77,166,255,.12);
    filter: blur(24px);
}

.card:hover {
    transform: translateY(-5px);
    border-color: rgba(126,203,255,.34);
    box-shadow: 0 22px 42px rgba(0,0,0,.28), 0 0 28px rgba(77,166,255,.1);
}

.card h3 { position: relative; word-break: break-word; }
.card p { position: relative; margin-top: 10px; color: var(--muted); font-size: 13px; }
.card p + p { margin-top: 5px; }

/* STATUS */
.status {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    margin-top: 14px;
    padding: 6px 11px;
    border: 1px solid currentColor;
    border-radius: 999px;
    font-size: 10px;
    letter-spacing: .9px;
    font-weight: 800;
}

.pending { color: var(--gold); background: rgba(255,193,7,.1); }
.approved { color: var(--green); background: rgba(40,167,69,.1); }
.verified { color: var(--blue); background: rgba(126,203,255,.1); }

/* BUTTONS */
.btn {
    position: relative;
    width: 100%;
    min-height: 39px;
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-radius: 11px;
    font-size: 12px;
    font-weight: 800;
    transition: .25s ease;
}

.btn:hover, .receipt-btn:hover, .generate-btn:hover, .close-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
.approve { color: #04140a; background: linear-gradient(135deg, #5df39a, #25be70); box-shadow: 0 8px 18px rgba(37,190,112,.15); }
.delete { color: white; background: linear-gradient(135deg, #ff7180, #bd3547); box-shadow: 0 8px 18px rgba(189,53,71,.15); }
.verify { color: #171000; background: linear-gradient(135deg, #ffe58b, #edae18); }
.unverify { color: #e7edf5; background: rgba(255,255,255,.08); border-color: var(--line); }

/* VERIFIED BADGE */
.badge { display: inline-flex; align-items: center; margin-left: 6px; vertical-align: middle; }
.badge-circle {
    display: grid;
    place-items: center;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    color: #0a1420;
    background: linear-gradient(135deg, #fff09c, #f2b900);
    box-shadow: 0 0 15px rgba(255,215,0,.55);
}
.check { position: static; font-size: 12px; font-weight: 900; }

/* FLOATING PARTICLES */
.particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.particle { position: absolute; color: #4da6ff; opacity: .24; animation: floatUp linear infinite; text-shadow: 0 0 10px #4da6ff; }
@keyframes floatUp { 0% { transform: translateY(110vh); opacity: 0; } 50% { opacity: .45; } 100% { transform: translateY(-10vh); opacity: 0; } }

/* RECEIPTS */
.receipts-panel { padding: 0 2px; }
.receipts-panel h3 { margin-bottom: 16px; }
.receipt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; margin-top: 0; }
.receipt-btn {
    min-height: 116px;
    padding: 18px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 19px;
    color: white;
    font-size: 15px;
    font-weight: 800;
    text-align: left;
    transition: .3s ease;
    backdrop-filter: blur(12px);
}
.boost { background: linear-gradient(135deg, rgba(59,130,246,.9), rgba(30,58,138,.78)); box-shadow: 0 15px 28px rgba(59,130,246,.18); }
.amplify { background: linear-gradient(135deg, rgba(34,197,94,.9), rgba(20,83,45,.78)); box-shadow: 0 15px 28px rgba(34,197,94,.18); }
.prime { background: linear-gradient(135deg, rgba(168,85,247,.9), rgba(59,7,100,.78)); box-shadow: 0 15px 28px rgba(168,85,247,.18); }
.elite { color: #160f00; background: linear-gradient(135deg, rgba(250,204,21,.96), rgba(133,77,14,.86)); box-shadow: 0 15px 28px rgba(250,204,21,.18); }

/* MODAL */
.modal { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 20px; background: rgba(1,6,13,.72); backdrop-filter: blur(14px); }
.modal-card {
    width: min(420px, 100%);
    padding: 25px;
    border: 1px solid rgba(174,224,255,.22);
    border-radius: 22px;
    background: linear-gradient(145deg, rgba(20,40,66,.94), rgba(7,16,29,.94));
    box-shadow: 0 28px 80px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(24px);
}
.modal-card h3 { margin-bottom: 17px; }
.modal-card input { width: 100%; margin: 6px 0; padding: 12px 13px; border: 1px solid var(--line); border-radius: 11px; outline: none; color: white; background: rgba(3,10,19,.62); }
.modal-card input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(77,166,255,.12); }
.generate-btn, .close-btn { width: 100%; min-height: 42px; margin-top: 12px; padding: 11px; border: none; border-radius: 11px; font-weight: 800; transition: .25s ease; }
.generate-btn { color: #07111f; background: linear-gradient(135deg, #bceaff, var(--blue-strong)); }
.close-btn { color: white; background: rgba(255,255,255,.08); border: 1px solid var(--line); }

@media (max-width: 820px) {
    body { display: block; }
    .sidebar { position: relative; width: calc(100% - 24px); height: auto; margin: 12px; padding: 17px 14px; border-radius: 20px; }
    .sidebar h2 { margin-bottom: 16px; }
    .sidebar h2::after { margin-top: 7px; }
    .nav-item { display: inline-flex; width: calc(50% - 8px); margin: 4px 3px; min-height: 42px; }
    .nav-item:last-child { margin-top: 8px; border-top: 0; border-radius: 13px; }
    .main { margin-left: 0; padding: 4px 12px 36px; }
    .header { margin-bottom: 20px; }
}

@media (max-width: 560px) {
    .nav-item { width: 100%; }
    .header { min-height: 60px; padding: 16px 18px; font-size: 19px; }
    .grid, .receipt-grid { grid-template-columns: 1fr; }
    .card { min-height: 0; }
    .receipt-btn { min-height: 82px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>

<!-- particles -->
<div class="particles" id="particles"></div>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h2>UNISTAY ADMIN</h2>

    <div class="nav-item" onclick="showSection('users')">👤 Users</div>
    <div class="nav-item" onclick="showSection('properties')">🏠 Properties</div>
    <div class="nav-item" onclick="showSection('receipts')">🧾 Receipts</div>

    <div class="nav-item" onclick="logout()">🚪 Logout</div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

    <div class="header" id="title">Dashboard</div>

    <!-- USERS -->
    <div id="usersSection">
        <h3>Users Management</h3>
        <div class="grid" id="users"></div>
    </div>

    <!-- PROPERTIES -->
    <div id="propertiesSection" style="display:none;">
        <h3>Property Management</h3>
        <div class="grid" id="properties"></div>
    </div>

    <!-- RECEIPTS (NOW INSIDE MAIN) -->
    <div id="receiptsSection" style="display:none;" class="receipts-panel">

        <h3>Generate Receipts</h3>

        <div class="receipt-grid">

            <button class="receipt-btn boost" onclick="openReceipt('Boost')">
                Boost Receipt
            </button>

            <button class="receipt-btn amplify" onclick="openReceipt('Amplify')">
                Amplify Receipt
            </button>

            <button class="receipt-btn prime" onclick="openReceipt('Prime')">
                Prime Receipt
            </button>

            <button class="receipt-btn elite" onclick="openReceipt('Elite')">
                Elite Receipt
            </button>

        </div>
    </div>

</div>

<div id="receiptModal" class="modal">
    <div class="modal-card">

        <h3 id="receiptTitle">Generate Receipt</h3>

        <input id="rHostel" placeholder="Hostel Name">
        <input id="rDate" type="date">
        <input id="rAmount" placeholder="Funds Paid (UGX)">

        <button class="generate-btn" onclick="generateReceipt()">
            Generate PDF
        </button>

        <button onclick="closeReceipt()" class="close-btn">
            Cancel
        </button>

    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwDxwL4j_fgzGi1ffHhaG36nw2uzNiZ1E",
  authDomain: "unistay-v1.firebaseapp.com",
  projectId: "unistay-v1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "douglaskabaale@gmail.com";

/* AUTH (UNCHANGED LOGIC) */
onAuthStateChanged(auth, (user) => {
    if (!user || user.email !== ADMIN_EMAIL) {
        window.location = "auth.html";
    } else {
        loadUsers();
        loadProperties();
    }
});

/* NAV */
window.showSection = (section) => {

    const sections = ["usersSection", "propertiesSection", "receiptsSection"];

    sections.forEach(id => {
        document.getElementById(id).style.display = "none";
    });

    document.getElementById(section + "Section").style.display = "block";
};

/* USERS */
async function loadUsers() {
    const snap = await getDocs(collection(db, "users"));

    const box = document.getElementById("users");
    box.innerHTML = "";

    snap.forEach(u => {
        const d = u.data();

        const verified = d.status === "verified";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <h3>
                ${d.email || "No email"}

                ${verified ? `
                <span class="badge">
                    <span class="badge-circle"><span class="check">✔</span></span>
                </span>` : ""}
            </h3>

           <span class="status ${d.status || "pending"}">
              ${(d.status || "pending").toUpperCase()}
           </span>

           <button class="btn approve" onclick="approveUser('${u.id}')">
              Approve
           </button>

           <button class="btn verify" onclick="verify('${u.id}')">
              Verify
           </button>

           <button class="btn unverify" onclick="unverify('${u.id}')">
              Unverify
           </button>
        `;

        box.appendChild(card);
    });
}

/* PROPERTIES */
async function loadProperties() {

    const snap = await getDocs(collection(db, "properties"));

    const box = document.getElementById("properties");
    box.innerHTML = "";

    snap.forEach(p => {

        const d = p.data();

        const plan = d.plan || "boost";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <h3>${d.hostelName || "Unnamed Hostel"}</h3>

            <p>${d.university || "No University"}</p>

            <p>Plan: ${plan}</p>

            <span class="status ${d.status || "pending"}">
                ${(d.status || "pending").toUpperCase()}
            </span>

            <button class="btn approve" onclick="approve('${p.id}')">
                Approve
            </button>

            <button class="btn delete" onclick="remove('${p.id}')">
                Delete
            </button>
        `;

        box.appendChild(card);

    });
}

/* ACTIONS (UNCHANGED) */
window.verify = async (id) => {
    await updateDoc(doc(db,"users",id), { status:"verified" });
    loadUsers();
};

window.unverify = async (id) => {
    await updateDoc(doc(db,"users",id), { status:"approved" });
    loadUsers();
};

window.approve = async (id) => {
    await updateDoc(doc(db,"properties",id), { status:"approved" });
    loadProperties();
};

window.remove = async (id) => {
    await deleteDoc(doc(db,"properties",id));
    loadProperties();
};

window.logout = () => signOut(auth).then(() => window.location="auth.html");

/* particles */
const symbols = ["✦","✧","✺","✷","∞","+","◆"];
const box = document.getElementById("particles");

for (let i = 0; i < 35; i++) {
    let p = document.createElement("div");
    p.className = "particle";
    p.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left = Math.random()*100 + "vw";
    p.style.animationDuration = (6 + Math.random()*6) + "s";
    p.style.fontSize = (16 + Math.random()*18) + "px";
    box.appendChild(p);
}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let selectedPlan = "";


function openReceipt(plan) {
    selectedPlan = plan;
    document.getElementById("receiptTitle").innerText =
        plan + " Subscription Receipt";

    document.getElementById("receiptModal").style.display = "flex";
}

function closeReceipt() {
    document.getElementById("receiptModal").style.display = "none";
}

/* =========================
   PDF GENERATION
========================= */
function generateReceipt() {

    const hostel = document.getElementById("rHostel").value;
    const date = document.getElementById("rDate").value;
    const amount = document.getElementById("rAmount").value;

    if (!hostel || !date || !amount) {
        alert("Fill all fields");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // ===================== COLORS (UNISTAY THEME) =====================
    const blue = [77, 166, 255];
    const dark = [5, 7, 13];
    const green = [0, 200, 83];
    const purple = [168, 85, 247];

    // ===================== HEADER =====================
    doc.setFillColor(...dark);
    doc.rect(0, 0, 210, 40, "F");

    doc.setTextColor(...blue);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(20);
    doc.text("UNISTAY", 14, 20);

    doc.setFontSize(11);
    doc.setTextColor(200, 220, 255);
    doc.text("Premium Hostel Listing Platform", 14, 28);

    doc.setTextColor(255, 255, 255);
    doc.text("OFFICIAL PAYMENT RECEIPT", 140, 20);

    // ===================== RECEIPT ID =====================
    const receiptId = "UNI-" + Math.floor(Math.random() * 99999999);

    doc.setFontSize(10);
    doc.setTextColor(150);
    doc.text("Receipt ID: " + receiptId, 140, 28);

    // ===================== BODY =====================
    doc.setTextColor(30, 30, 30);
    doc.setFontSize(12);

    doc.text("This document serves as an official confirmation of payment received by UNISTAY.", 14, 55);

    doc.setFont("helvetica", "bold");
    doc.text("Hostel Name:", 14, 75);
    doc.text(hostel, 60, 75);

    doc.text("Subscription Plan:", 14, 85);
    doc.text(selectedPlan, 60, 85);

    doc.text("Date of Payment:", 14, 95);
    doc.text(date, 60, 95);

    doc.text("Amount Paid:", 14, 105);
    doc.setTextColor(...green);
    doc.text("UGX " + amount, 60, 105);

    // ===================== PREMIUM MESSAGE =====================
    doc.setTextColor(60, 60, 60);
    doc.setFont("helvetica", "normal");

    doc.text(
        "UNISTAY confirms that the above payment has been successfully received and processed.",
        14,
        125,
        { maxWidth: 180 }
    );

    doc.text(
        "The hostel listing has been upgraded to the selected subscription tier and is now active on the platform.",
        14,
        140,
        { maxWidth: 180 }
    );

    // ====
