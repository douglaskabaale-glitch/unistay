<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNISTAY - Spotlight</title>

<style>
:root {
    --bg: #07111f;
    --bg-deep: #040a13;
    --text: #f5f8ff;
    --muted: #9ba9bd;
    --line: rgba(255, 255, 255, 0.13);
    --surface: rgba(13, 26, 44, 0.58);
    --surface-strong: rgba(18, 34, 55, 0.8);
    --blue: #7ecbff;
    --blue-strong: #4da6ff;
    --violet: #ad8cff;
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    margin: 0;
    min-width: 320px;
    font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 12% 0%, rgba(77, 166, 255, 0.18), transparent 28rem),
        radial-gradient(circle at 88% 32%, rgba(145, 105, 255, 0.14), transparent 30rem),
        linear-gradient(145deg, var(--bg-deep), var(--bg) 52%, #0b1628);
    overflow-x: hidden;
}

body::before,
body::after {
    content: "";
    position: fixed;
    z-index: -1;
    width: 22rem;
    height: 22rem;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
}

body::before { background: #4da6ff; top: 28%; left: -14rem; }
body::after { background: #9a6dff; right: -12rem; bottom: 8%; }

button { font: inherit; }

/* ===== SPOTLIGHT HEADER ===== */
.spotlight-banner {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 15px clamp(18px, 4vw, 56px);
    background: rgba(5, 14, 27, 0.68);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(22px) saturate(145%);
    -webkit-backdrop-filter: blur(22px) saturate(145%);
}

.spotlight-content {
    max-width: 1240px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

.spotlight-badge {
    padding: 7px 12px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    color: #07111f;
    background: linear-gradient(135deg, #b7e6ff, var(--blue-strong));
    box-shadow: 0 0 22px rgba(77,166,255,0.3);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
}

.spotlight-title {
    color: #eef6ff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.8px;
}

.spotlight-sub {
    margin-left: auto;
    color: #a9c9e8;
    font-size: 12px;
    letter-spacing: 0.4px;
}

/* ===== HERO SLIDER ===== */
.hero-slider {
    position: relative;
    max-width: 1360px;
    height: min(70vh, 650px);
    min-height: 470px;
    margin: 22px auto 0;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 28px;
    box-shadow: var(--shadow), 0 0 70px rgba(77,166,255,0.09);
    isolation: isolate;
}

.hero-slider::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    border-radius: inherit;
    background: linear-gradient(110deg, rgba(6,15,28,0.42), transparent 58%), linear-gradient(0deg, rgba(4,10,19,0.72), transparent 48%);
}

.hero-track {
    display: flex;
    height: 100%;
    transition: transform 0.8s cubic-bezier(.22,.8,.25,1);
}

.hero-slide {
    position: relative;
    min-width: 100%;
    background-color: #15253a;
    background-size: cover;
    background-position: center;
}

.hero-slide::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(3,10,19,0.72), transparent 65%), linear-gradient(to top, rgba(3,10,19,0.75), transparent 48%);
}

.hero-content {
    position: absolute;
    z-index: 4;
    left: clamp(24px, 6vw, 78px);
    bottom: clamp(32px, 7vw, 72px);
    max-width: 560px;
}

.hero-content h1 {
    margin: 0 0 10px;
    color: #fff;
    font-size: clamp(34px, 5vw, 68px);
    line-height: 0.98;
    letter-spacing: -2px;
    text-shadow: 0 4px 26px rgba(0,0,0,0.35);
}

.hero-content p {
    margin: 0 0 24px;
    color: #d7e8f7;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.4px;
}

/* ===== HERO BUTTONS ===== */
.hero-btn {
    min-height: 44px;
    padding: 11px 19px;
    border: 1px solid transparent;
    border-radius: 13px;
    cursor: pointer;
    color: #07111f;
    font-weight: 800;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.view-btn {
    background: linear-gradient(135deg, #c6edff, var(--blue));
    box-shadow: 0 10px 30px rgba(77,166,255,0.28);
}

.contact-btn {
    color: white;
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
}

.hero-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(77,166,255,0.35);
}

/* ===== SECTIONS ===== */
.section {
    max-width: 1360px;
    margin: 0 auto;
    padding: 38px clamp(18px, 4vw, 56px) 6px;
}

.section h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 17px;
    color: #dceafa;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
}

.section h2::after {
    content: "";
    height: 1px;
    flex: 1;
    background: linear-gradient(90deg, var(--line), transparent);
}

/* ===== ROW ===== */
.row {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    padding: 5px 4px 18px;
    scrollbar-width: thin;
    scrollbar-color: rgba(126,203,255,0.35) transparent;
}

.row::-webkit-scrollbar { height: 5px; }
.row::-webkit-scrollbar-track { background: transparent; }
.row::-webkit-scrollbar-thumb { background: rgba(126,203,255,0.3); border-radius: 99px; }

/* ===== FEATURED (BIG CARDS) ===== */
.featured-card {
    position: relative;
    min-width: 220px;
    height: 294px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 21px;
    cursor: pointer;
    background: var(--surface);
    box-shadow: 0 16px 35px rgba(0,0,0,0.22);
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
}

.featured-card img,
.small-card img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform .5s ease;
}

.featured-card:nth-child(1) { box-shadow: 0 16px 38px rgba(77,166,255,0.17); }
.featured-card:nth-child(2) { box-shadow: 0 16px 38px rgba(168,85,247,0.17); }
.featured-card:nth-child(3) { box-shadow: 0 16px 38px rgba(34,197,94,0.17); }

.featured-card::after,
.small-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(3,9,17,0.9), transparent 57%);
    pointer-events: none;
}

.featured-card:hover,
.small-card:hover {
    transform: translateY(-7px);
    border-color: rgba(174,224,255,0.55);
    box-shadow: 0 22px 45px rgba(0,0,0,0.35), 0 0 24px rgba(77,166,255,0.22);
}

.featured-card:hover img,
.small-card:hover img { transform: scale(1.07); }

.featured-info,
.small-info {
    position: absolute;
    z-index: 2;
    right: 0;
    bottom: 0;
    left: 0;
    padding: 18px 15px 15px;
}

.featured-info h4 {
    margin: 0 0 5px;
    color: white;
    font-size: 16px;
}

.featured-info p {
    margin: 0;
    color: #b5ddfb;
    font-size: 13px;
    font-weight: 600;
}

/* ===== STUDENT FREQUENT (SMALL CARDS) ===== */
.small-card {
    position: relative;
    min-width: 158px;
    height: 202px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px;
    cursor: pointer;
    background: var(--surface);
    box-shadow: 0 14px 30px rgba(0,0,0,0.2);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.small-info {
    padding: 16px 11px 12px;
    color: #f4f8ff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.3;
}

@media (max-width: 700px) {
    .spotlight-banner { padding: 13px 16px; }
    .spotlight-title { font-size: 12px; letter-spacing: 1px; }
    .spotlight-sub { display: none; }
    .hero-slider {
        min-height: 430px;
        height: 62vh;
        margin: 14px 12px 0;
        border-radius: 22px;
    }
    .hero-content h1 { letter-spacing: -1px; }
    .featured-card { min-width: 188px; height: 260px; }
    .small-card { min-width: 140px; height: 180px; }
    .section { padding-top: 30px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>

    <div class="spotlight-banner">
    <div class="spotlight-content">
        <div class="spotlight-badge">UNISTAY</div>
        <div class="spotlight-title">SPOTLIGHT LISTINGS</div>
        <div class="spotlight-sub">Premium & Featured Hostels Only</div>
    </div>
</div>

<!-- HERO SLIDER -->
<div class="hero-slider">
    <div class="hero-track" id="heroTrack"></div>
</div>

<!-- FEATURED -->
<div class="section">
    <h2>🌟 Featured List</h2>
    <div class="row" id="featuredRow"></div>
</div>

<!-- STUDENT FREQUENT -->
<div class="section">
    <h2>🎯 Student Frequent</h2>
    <div class="row" id="frequentRow"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "unistay-v1.firebaseapp.com",
  projectId: "unistay-v1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOAD DATA */
async function loadData() {
    const snap = await getDocs(collection(db, "properties"));

    let data = [];
    snap.forEach(doc => {
    const p = doc.data();
    const plan = p.plan || "boost";

    data.push({ id: doc.id, ...p, plan });
});

    if (!data.length) return;

    render(data);
}

/* HERO SLIDES */
function renderHero(elite) {
    const track = document.getElementById("heroTrack");

    track.innerHTML = elite.map(h => `
        <div class="hero-slide" style="background-image:url(${h.cover})">
            <div class="hero-content">
                <h1>${h.hostelName}</h1>
                <p>UGX ${h.price}</p>
                <button class="hero-btn view-btn" onclick="go('${h.id}')">
                   View Hostel
                </button>
            </div>
        </div>
    `).join("");

    let index = 0;
    setInterval(() => {
        index = (index + 1) % elite.length;
        track.style.transform = `translateX(-${index * 100}%)`;
    }, 5000);
}

/* FEATURED */
function renderFeatured(data) {
    document.getElementById("featuredRow").innerHTML =
        data.map(h => `
            <div class="featured-card" onclick="go('${h.id || ""}')">
                <img src="${h.cover}">
                <div class="featured-info">
                    <h4>${h.hostelName}</h4>
                    <p>UGX ${h.price}</p>
                </div>
            </div>
        `).join("");
}

/* SMALL */
function renderFrequent(data) {
    document.getElementById("frequentRow").innerHTML =
        data.map(h => `
            <div class="small-card" onclick="go('${h.id || ""}')">
                <img src="${h.cover}">
                <div class="small-info">
                    ${h.hostelName}
                </div>
            </div>
        `).join("");
}

/* NAV */
window.go = (id) => {
    if (!id) return;
    window.location.href = `hostel-details.html?id=${encodeURIComponent(id)}`;
};

/* MAIN */
function render(data) {

    const elite = data.filter(h => h.plan === "elite");
    const prime = data.filter(h => h.plan === "prime");
    const amplify = data.filter(h => h.plan === "amplify");

    renderHero(elite);
    renderFeatured(prime);
    renderFrequent(amplify);
}

loadData();

</script>

</body>
</html>
