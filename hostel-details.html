<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNISTAY - Hostel Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="unistay-theme.css">

<style>
.header{
    background: var(--paper-raised);
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    padding: 16px 20px;
    text-align: center;
    font-family: "Lora", serif;
    font-size: 19px;
    font-weight: 700;
}

.container{
    max-width: 860px;
    margin: auto;
    padding: 20px;
}

.main-img{
    width: 100%;
    height: 320px;
    object-fit: cover;
    border-radius: var(--radius-md);
    border: 1px solid var(--rule);
}

.gallery{
    display: flex;
    gap: 10px;
    margin-top: 10px;
    overflow-x: auto;
}
.gallery img{
    width: 110px;
    height: 82px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: 1px solid var(--rule);
}

.card{
    background: var(--paper-raised);
    padding: 20px;
    border-radius: var(--radius-md);
    margin-top: 16px;
    border: 1px solid var(--rule);
}

.title{
    font-family: "Lora", serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
}

.details-grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
}

.detail-box{
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 13px 14px;
    border-radius: var(--radius-sm);
}

.label{
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
}

.value{
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
}

.price-box{
    background: var(--pen-blue-tint);
    border-color: rgba(44,91,140,0.2);
}
.price-box .label{ color: var(--pen-blue-dark); }
.price-box .value{ color: var(--pen-blue-dark); font-size: 18px; }

.tags{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

/* BOOK BUTTON — flat, no glow/shine */
.book-btn{
    margin-top: 16px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--leaf-green);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}
.book-btn:hover{ background: #2f5a3c; }

/* REVIEWS */
.reviews-box{
    margin-top: 22px;
    background: var(--paper-raised);
    padding: 20px;
    border-radius: var(--radius-md);
    border: 1px solid var(--rule);
}
.reviews-box h3{ margin-bottom: 12px; font-size: 17px; }

.avg-rating{
    font-weight: 700;
    color: var(--amber);
    margin-bottom: 15px;
    background: var(--amber-tint);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    display: inline-block;
}

.review{
    background: var(--paper);
    padding: 13px 14px;
    margin-top: 10px;
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--pen-blue);
}
.review p{ margin-top: 6px; color: var(--ink-soft); font-size: 14px; }

.review-field{
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    font-family: "Inter", sans-serif;
}
textarea.review-field{ height: 80px; resize: vertical; }

.submit-review-btn{
    margin-top: 4px;
    width: 100%;
    padding: 11px;
    background: var(--pen-blue);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: 600;
    cursor: pointer;
}
.submit-review-btn:hover{ background: var(--pen-blue-dark); }
</style>
</head>

<body>

<div class="header">Hostel Details</div>

<div class="container">

    <img id="mainImage" class="main-img">

    <div class="gallery" id="gallery"></div>

    <div class="card">
        <div class="title" id="name"></div>

        <div class="details-grid">

            <div class="detail-box price-box">
                <div class="label">Price</div>
                <div class="value" id="price"></div>
            </div>

            <div class="detail-box">
                <div class="label">Room Type</div>
                <div class="value" id="room"></div>
            </div>

            <div class="detail-box">
                <div class="label">Location</div>
                <div class="value" id="location"></div>
            </div>

            <div class="detail-box">
                <div class="label">Amenities</div>
                <div class="tags" id="amenities"></div>
            </div>

            <div class="detail-box">
                <div class="label">Contact</div>
                <div class="value" id="contact"></div>
            </div>

            <div class="detail-box">
                <div class="label">Description</div>
                <div class="value" id="desc"></div>
            </div>

            <button class="book-btn" onclick="bookNow()">Book now on WhatsApp</button>

        </div>

       
    </div>

    <div class="reviews-box">
        <h3>Reviews</h3>

        <div id="avgRating" class="avg-rating">Loading reviews...</div>

        <input id="rating" type="number" min="1" max="5"
               placeholder="Rating (1-5)"
               class="review-field">

        <textarea id="reviewText"
                  placeholder="Write your review..."
                  class="review-field"></textarea>

        <button onclick="submitReview()" class="submit-review-btn">
            Submit review
        </button>

        <div id="reviewsContainer"></div>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwDxwL4j_fgzGi1ffHHhaG36nw2uzNiE",
  authDomain: "unistay-v1.firebaseapp.com",
  projectId: "unistay-v1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =========================
   GET ID FROM URL
========================= */
const params = new URLSearchParams(window.location.search);
const propertyId = params.get("id");

let property = null;

/* =========================
   LOAD HOSTEL
========================= */
async function loadProperty() {

    if (!propertyId) {
        alert("No hostel selected");
        window.location.href = "spotlight.html";
        return;
    }

    const ref = doc(db, "properties", propertyId);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
        alert("Hostel not found");
        window.location.href = "spotlight.html";
        return;
    }

    property = { id: snap.id, ...snap.data() };

    renderProperty();
    loadReviews();
}

/* =========================
   RENDER HOSTEL
========================= */
function renderProperty() {

    document.getElementById("mainImage").src = property.cover || "";
    document.getElementById("name").innerText = property.hostelName || "";
    document.getElementById("price").innerText = "UGX " + (property.price || "");
    document.getElementById("room").innerText = property.roomType || "Standard";
    document.getElementById("location").innerText = property.location || "Not set";
    document.getElementById("contact").innerText = property.contact || "Not available";
    document.getElementById("desc").innerText = property.description || "No description";

    document.getElementById("amenities").innerHTML =
        (property.amenities || "")
        .split(",")
        .filter(a => a.trim())
        .map(a => `<span class="u-tag">${a.trim()}</span>`)
        .join("");
}

/* =========================
   WHATSAPP BOOKING
========================= */
window.bookNow = function () {

    let phone = (property.contact || "").replace(/\s+/g, '');
    if (!phone.startsWith("+")) phone = "+256" + phone;

    const msg = `Hello, I found your hostel listing on https://douglaskabaale-glitch.github.io/unistay/ and I'm interested in ${property.hostelName}`;

    window.open(
        `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
        "_blank"
    );
};

/* =========================
   REVIEWS
========================= */
window.submitReview = async function () {

    const rating = Number(document.getElementById("rating").value);
    const text = document.getElementById("reviewText").value;

    if (!rating || !text) return alert("Fill all fields");

    await addDoc(collection(db, "properties", property.id, "reviews"), {
        rating,
        text,
        createdAt: serverTimestamp()
    });

    document.getElementById("rating").value = "";
    document.getElementById("reviewText").value = "";

    loadReviews();
};

async function loadReviews() {

    const snap = await getDocs(collection(db, "properties", property.id, "reviews"));

    let reviews = [];
    let total = 0;

    snap.forEach(d => {
        const r = d.data();
        reviews.push(r);
        total += r.rating || 0;
    });

    const avg = reviews.length ? (total / reviews.length).toFixed(1) : 0;

    document.getElementById("avgRating").innerText =
        reviews.length ? `⭐ ${avg} / 5 (${reviews.length})` : "No reviews yet";

    document.getElementById("reviewsContainer").innerHTML =
        reviews.map(r => `
            <div class="review">
                ⭐ ${r.rating}/5
                <p>${r.text}</p>
            </div>
        `).join("");
}

/* =========================
   INIT
========================= */
loadProperty();
</script>

</body>
</html>
