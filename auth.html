<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNISTAY - Access</title>

<style>
:root {
    --bg: #050b15;
    --panel: rgba(12, 25, 43, .76);
    --line: rgba(179, 222, 255, .15);
    --text: #f3f8ff;
    --muted: #9aacc2;
    --blue: #7ecbff;
    --blue-strong: #4da6ff;
    --violet: #aa86ff;
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    color: var(--text);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at 12% 4%, rgba(77,166,255,.2), transparent 27rem),
        radial-gradient(circle at 88% 85%, rgba(170,134,255,.16), transparent 26rem),
        linear-gradient(145deg, #040812, var(--bg) 52%, #0b172a);
}

body::before,
body::after {
    content: "";
    position: fixed;
    z-index: 0;
    width: 22rem;
    height: 22rem;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .15;
    pointer-events: none;
}

body::before { top: 22%; left: -13rem; background: #4da6ff; }
body::after { right: -13rem; bottom: 2%; background: #9b6cff; }

button, input { font: inherit; }

/* HEADER */
.header {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 74px;
    padding: 16px;
    color: #eaf7ff;
    background: rgba(6, 17, 31, .65);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 12px 36px rgba(0,0,0,.2), inset 0 -1px 0 rgba(255,255,255,.03);
    backdrop-filter: blur(22px) saturate(145%);
    -webkit-backdrop-filter: blur(22px) saturate(145%);
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(126,203,255,.42);
}

.header::before {
    content: "";
    position: absolute;
    top: 0;
    width: 90px;
    height: 3px;
    border-radius: 0 0 99px 99px;
    background: linear-gradient(90deg, var(--blue-strong), var(--violet));
    box-shadow: 0 0 20px rgba(77,166,255,.55);
}

/* CONTAINER */
.container {
    position: relative;
    z-index: 2;
    width: min(430px, calc(100% - 32px));
    margin: clamp(34px, 8vh, 76px) auto 40px;
    padding: clamp(24px, 5vw, 34px);
    overflow: hidden;
    border: 1px solid rgba(179,222,255,.19);
    border-radius: 25px;
    background: linear-gradient(145deg, rgba(20, 40, 66, .78), rgba(7, 16, 29, .78));
    box-shadow: 0 28px 75px rgba(0,0,0,.38), 0 0 55px rgba(77,166,255,.08), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(25px) saturate(130%);
    -webkit-backdrop-filter: blur(25px) saturate(130%);
}

.container::before {
    content: "";
    position: absolute;
    width: 15rem;
    height: 15rem;
    top: -10rem;
    right: -5rem;
    border-radius: 50%;
    background: rgba(77,166,255,.15);
    filter: blur(22px);
    pointer-events: none;
}

.container h2 {
    position: relative;
    margin: 0 0 23px;
    color: #f6fbff;
    font-size: 27px;
    letter-spacing: -.6px;
}

.container h2::after {
    content: "";
    display: block;
    width: 42px;
    height: 3px;
    margin-top: 11px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--blue-strong), var(--blue));
}

/* INPUTS */
input {
    display: block;
    width: 100%;
    min-height: 47px;
    margin: 9px 0;
    padding: 12px 14px;
    color: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: none;
    background: rgba(2, 9, 18, .55);
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

input::placeholder { color: #8498b0; }
input:focus { border-color: rgba(126,203,255,.72); background: rgba(8,22,39,.8); box-shadow: 0 0 0 4px rgba(77,166,255,.11), 0 0 20px rgba(77,166,255,.08); }

/* BUTTON */
button {
    width: 100%;
    min-height: 47px;
    margin-top: 10px;
    padding: 12px;
    color: #06111e;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 13px;
    background: linear-gradient(135deg, #c0edff, var(--blue-strong));
    box-shadow: 0 12px 25px rgba(77,166,255,.19);
    cursor: pointer;
    font-weight: 800;
    transition: transform .24s ease, filter .24s ease, box-shadow .24s ease;
}

button:hover { transform: translateY(-3px); filter: brightness(1.06); box-shadow: 0 16px 30px rgba(77,166,255,.3); }
button:active { transform: translateY(-1px); }

/* SWITCH */
.switch {
    margin-top: 18px;
    color: var(--blue);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    transition: color .2s ease;
}
.switch:hover { color: white; text-decoration: underline; text-underline-offset: 4px; }

/* STRENGTH / ACCOUNT TYPE */
#strength { min-height: 17px; margin: -2px 0 5px; font-size: 12px; font-weight: 700; }
.container p[style] { margin: 17px 0 4px !important; color: var(--muted) !important; }
.container p strong { color: #dcecff; }

/* PROFILE PREVIEW */
#preview {
    width: 72px;
    height: 72px;
    margin: 15px auto 10px;
    display: block;
    object-fit: cover;
    border: 2px solid var(--blue);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(77,166,255,.28);
}

/* FILE LABEL */
.file-label {
    display: block;
    margin: 12px 0;
    padding: 12px;
    color: #07111f;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 13px;
    background: linear-gradient(135deg, #c0edff, var(--blue-strong));
    box-shadow: 0 10px 22px rgba(77,166,255,.16);
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    text-align: center;
    transition: .24s ease;
}
.file-label:hover { transform: translateY(-2px); filter: brightness(1.06); }
.file-label input { display: none; }

/* FLOATING SYMBOLS */
.symbol { position: absolute; z-index: 1; color: rgba(126,203,255,.14); animation: float 12s linear infinite; text-shadow: 0 0 12px #4da6ff; user-select: none; }
@keyframes float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 50% { opacity: .46; } 100% { transform: translateY(-10vh) rotate(180deg); opacity: 0; } }

/* MESSAGE */
#msg { min-height: 20px; margin: 16px 0 0; color: #ff8995; font-size: 13px; line-height: 1.45; font-weight: 700; text-align: center; }

@media (max-width: 520px) {
    .header { min-height: 64px; font-size: 18px; }
    .container { margin-top: 24px; padding: 23px 19px; border-radius: 21px; }
    .container h2 { font-size: 24px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>

<div class="header">UNISTAY</div>

<div class="container">

<div id="loginForm">
    <h2>Login</h2>
    <input type="text" id="loginUser" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="switch" onclick="showSignup()">Create account</div>
</div>

<div id="signupForm" style="display:none;">
    <h2>Create Account</h2>

    <input type="text" id="signupUser" placeholder="Username">

    <label class="file-label" id="fileLabel">
        Choose Profile Picture
        <input type="file" id="profilePic" accept="image/*" onchange="loadImage(event)">
    </label>

    <img id="preview" src="" style="display:none;">

    <input type="text" id="signupContact" placeholder="Email">

    <input type="password" id="signupPass" placeholder="Password" oninput="checkStrength()">
    <div id="strength"></div>

    <input type="password" id="confirmPass" placeholder="Confirm Password">

    <p style="text-align:center; color:#aaa; font-size:14px;">
        Account Type: <strong>Landlord</strong>
    </p>

    <button onclick="signup()">Sign Up</button>
    <div class="switch" onclick="showLogin()">Back to login</div>
</div>

<p id="msg"></p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* KEEP YOUR ORIGINAL CONFIG (UNCHANGED) */
const firebaseConfig = {
  apiKey: "AIzaSyCwDxwL4j_fgzGi1ffHhaG36nw2uzNiZ1E",
  authDomain: "unistay-v1.firebaseapp.com",
  projectId: "unistay-v1",
  storageBucket: "unistay-v1.firebasestorage.app",
  messagingSenderId: "125895379967",
  appId: "1:125895379967:web:197892746f83a6bf3cf5ca"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* FLOATING SYMBOLS */
const symbols = ["π","Σ","√","∫","θ","x²","∞","Δ"];

for (let i = 0; i < 35; i++) {
    let s = document.createElement("div");
    s.className = "symbol";
    s.innerText = symbols[Math.floor(Math.random() * symbols.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (6 + Math.random() * 10) + "s";
    s.style.top = Math.random() * 100 + "vh";
    document.body.appendChild(s);
}

/* MESSAGE */
function showMessage(text, color="red") {
    let msg = document.getElementById("msg");
    msg.style.color = color;
    msg.innerText = text;
}

/* NAV */
window.showSignup = function() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "block";
    showMessage("");
}

window.showLogin = function() {
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
    showMessage("");
}

/* IMAGE */
let profileBase64 = "";

window.loadImage = function(event) {
    let reader = new FileReader();
    reader.onload = function () {
        profileBase64 = reader.result;

        let img = document.getElementById("preview");
        img.src = profileBase64;
        img.style.display = "block";

        document.getElementById("fileLabel").innerText = "Image Selected ✅";
    };
    reader.readAsDataURL(event.target.files[0]);
}

/* PASSWORD STRENGTH */
window.checkStrength = function() {
    let pass = document.getElementById("signupPass").value;
    let strength = document.getElementById("strength");

    if (pass.length < 4) {
        strength.innerText = "Weak";
        strength.style.color = "#ff4d4d";
    } else if (pass.length < 8) {
        strength.innerText = "Medium";
        strength.style.color = "orange";
    } else {
        strength.innerText = "Strong";
        strength.style.color = "#00ff99";
    }
}

/* SIGNUP (UNCHANGED LOGIC) */
window.signup = async function() {
    let email = document.getElementById("signupContact").value.trim();
    let pass = document.getElementById("signupPass").value.trim();
    let confirm = document.getElementById("confirmPass").value.trim();
    let username = document.getElementById("signupUser").value.trim();

    if (!email || !pass || !confirm || !username) {
        showMessage("All fields are required!");
        return;
    }

    if (pass !== confirm) {
        showMessage("Passwords do not match!");
        return;
    }

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {
            name: username,
            email: email,
            role: "landlord",
            status: "pending",
            profileImage: profileBase64 || null,
            createdAt: new Date()
        });

        showMessage("Account created successfully!", "#00ff99");

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1000);

    } catch (error) {
        showMessage(error.message);
    }
}

/* LOGIN (UNCHANGED LOGIC) */
window.login = async function() {
    let email = document.getElementById("loginUser").value.trim();
    let pass = document.getElementById("loginPass").value.trim();

    if (!email || !pass) {
        showMessage("Please fill in all login fields!");
        return;
    }

    try {
        await signInWithEmailAndPassword(auth, email, pass);

        showMessage("Login successful!", "#00ff99");

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 800);

    } catch (error) {
        showMessage("Invalid login!");
    }
}

</script>

</body>
</html>
